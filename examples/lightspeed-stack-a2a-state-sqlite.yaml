name: Lightspeed Core Service (LCS)
service:
  host: localhost
  port: 8080
  base_url: "http://localhost:8080"
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
ogx:
  use_as_library_client: true
  # Unified mode: the run.yaml next to this file is the synthesis profile.
  config:
    profile: run.yaml
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"
authentication:
  module: "noop"
customization:
  agent_card_path: agent_card.yaml
a2a_state:
  sqlite:
    db_path: /tmp/data/a2a_state.sqlite
