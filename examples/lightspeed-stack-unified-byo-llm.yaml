# Unified single-file configuration: no run.yaml is needed.
#
# Lightspeed Core Stack synthesizes the OGX run configuration at startup from
# this file. `baseline: byo-llm` starts from the built-in baseline without any
# LLM provider ("bring your own LLM"); the providers are declared under the
# top-level `inference.providers` section.
#
# The API key is read from the environment variable named by `api_key_env`;
# its value is never written to disk.
name: Lightspeed Core Service (LCS)
service:
  host: localhost
  port: 8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
ogx:
  use_as_library_client: true
  config:
    baseline: byo-llm
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"
authentication:
  module: "noop"
inference:
  default_provider: openai
  default_model: gpt-4o-mini
  providers:
    - type: openai
      api_key_env: OPENAI_API_KEY
      allowed_models:
        - gpt-4o-mini
