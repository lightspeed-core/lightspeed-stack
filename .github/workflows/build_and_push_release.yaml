name: Build image from a tag and push it to Quay.io

on:
  push:
    tags:
      - '*'  # Trigger for all tags

env:
  IMAGE_NAME: lightspeed-stack
  IMAGE_NAMESPACE: lightspeed-core
  IMAGE_REGISTRY: quay.io
  GIT_TAG: ${{ github.ref_name }}
  LATEST_TAG: latest
  CONTAINER_FILE: deploy/lightspeed-stack/Containerfile

jobs:
  build-and-push-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for image pushing to a registry
      packages: write
    steps:
      - name: Install buildah
        run: |
          sudo apt-get update
          # arm64 builds need qemu-user binfmt registration. On Ubuntu 26.04
          # qemu-user-static is only a virtual package, provided by both
          # qemu-user-binfmt and qemu-user-binfmt-hwe, and apt will not
          # choose a provider. Older runners still ship the real package.
          if sudo apt-get install --simulate qemu-user-static >/dev/null 2>&1; then
            qemu_pkg=qemu-user-static
          else
            qemu_pkg=qemu-user-binfmt
          fi
          sudo apt-get install -y buildah "${qemu_pkg}"
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Fetch submodules (required for lightspeed-providers)
          submodules: 'recursive'
          # Fetch all tags to determine latest stable version
          fetch-tags: true
      - name: Determine if latest tag should be applied
        id: check_latest
        run: ./scripts/latest_tag.py
      - name: Build image with Buildah
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: >-
            ${{ env.GIT_TAG }}
            ${{ steps.check_latest.outputs.apply_latest == 'true' && env.LATEST_TAG || '' }}
          containerfiles: |
            ${{ env.CONTAINER_FILE }}
          archs: amd64, arm64
          oci: true
      - name: Check images
        run: |
          buildah images | grep '${{ env.IMAGE_NAME }}'
          echo '${{ steps.build_image.outputs.image }}'
          echo '${{ steps.build_image.outputs.tags }}'
      - name: Check manifest
        run: |
          set -x
          buildah manifest inspect ${{ steps.build_image.outputs.image-with-tag }}
      - name: Push image to Quay.io
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}
          username: ${{ secrets.QUAY_REGISTRY_USERNAME }}
          password: ${{ secrets.QUAY_REGISTRY_PASSWORD }}
