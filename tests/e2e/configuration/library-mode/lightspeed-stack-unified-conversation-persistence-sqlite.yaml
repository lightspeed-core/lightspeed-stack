name: Lightspeed Core Service (LCS)
service:
  host: 0.0.0.0
  port: 8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
llama_stack:
  use_as_library_client: true
  # Unified mode: run.yaml is the synthesis profile. Do not set
  # storage.stores.conversations under native_override — synthesis wires
  # conversations_default from conversation_cache.
  config:
    profile: run.yaml
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"
authentication:
  module: "noop"
# Same sqlite file for LCORE database + conversation_cache (and, via synthesis,
# OGX conversations_default). Outside /tmp (not ephemeral) and outside ~/.llama
# (e2e may rm -rf that tree). Survives `docker restart` on the container FS.
database:
  sqlite:
    db_path: "/opt/app-root/src/data/conversation-persistence.db"
conversation_cache:
  type: sqlite
  sqlite:
    db_path: "/opt/app-root/src/data/conversation-persistence.db"
inference:
  default_provider: openai
  default_model: gpt-4o-mini
byok_rag:
  - rag_id: e2e-test-docs
    rag_type: inline::faiss
    embedding_model: sentence-transformers/all-mpnet-base-v2
    embedding_dimension: 768
    vector_db_id: ${env.FAISS_VECTOR_STORE_ID}
    db_path: ${env.KV_RAG_PATH:=~/.llama/storage/rag/kv_store.db}
    score_multiplier: 1.0

rag:
  tool:
    - e2e-test-docs
