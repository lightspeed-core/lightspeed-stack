# @cfg_okp
# OKP tool RAG — offline mode.
# LLM calls file_search on demand; chunks use parent_id-based URLs (localhost:8081).
name: Lightspeed Core Service (LCS)
service:
  host: 0.0.0.0
  port: 8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
llama_stack:
  use_as_library_client: true
  config:
      baseline: default
    # profile: run.yaml
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"
conversation_cache:
  type: "sqlite"
  sqlite:
    db_path: "/tmp/data/conversation-cache.db"
authentication:
  module: "noop"
inference:
  default_provider: openai
  default_model: gpt-4o-mini
rag:
  retrieval:
    tool:
      sources:
        - okp
      max_chunks: 2
  okp:
    rhokp_url: ${env.RH_SERVER_OKP:=http://localhost:8081/solr}
    offline: true
    max_chunks: 5
