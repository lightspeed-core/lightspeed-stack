# Group: @cfg_negative
# Merges: no-cache + invalid-feedback-storage (see library twin)
name: Lightspeed Core Service (LCS) — grouped negative paths
service:
  host: 0.0.0.0
  port: 8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
llama_stack:
  use_as_library_client: false
  url: http://${env.E2E_LLAMA_HOSTNAME}:8321
  api_key: xyzzy
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/invalid"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"

# NO conversation_cache — cache-disabled + empty MCP list scenarios

authentication:
  module: "noop-with-token"
