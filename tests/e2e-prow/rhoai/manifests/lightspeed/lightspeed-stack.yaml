apiVersion: v1
kind: Pod
metadata:
  name: lightspeed-stack-service
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  # Seed agent-skills fixtures (docker-compose: ./tests/e2e/skills -> /app-root/skills).
  # ConfigMap cannot preserve nested skill dirs; extract tarball into emptyDir.
  initContainers:
    - name: seed-skills
      image: busybox:latest
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      command:
        - /bin/sh
        - -c
        - |
          set -e
          tar xzf /skills-seed/skills.tgz -C /skills-dest
          ls -la /skills-dest
      volumeMounts:
        - name: skills-seed
          mountPath: /skills-seed
          readOnly: true
        - name: skills
          mountPath: /skills-dest
  containers:
    - name: lightspeed-stack-container
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: E2E_LLAMA_HOSTNAME
          valueFrom:
            secretKeyRef:
              name: llama-stack-ip-secret
              key: key
        - name: FAISS_VECTOR_STORE_ID
          valueFrom:
            secretKeyRef:
              name: faiss-vector-store-secret
              key: id
              optional: true
        # Unused for server-mode FAISS (llama pod owns the fixture); keep out of ~/.llama.
        - name: KV_RAG_PATH
          value: "/app-root/.e2e-rag-work/kv_store.db"
        - name: VLLM_MODEL
          valueFrom:
            secretKeyRef:
              name: vllm-model-secret
              key: key
              optional: true
      image: ${LIGHTSPEED_STACK_IMAGE}
      command: ["/bin/sh", "-c", "mkdir -p /tmp/data && exec /app-root/entrypoint.sh"]
      ports:
        - containerPort: 8080
      # Readiness waits for providers/default model (/readiness). Liveness stays TCP so a
      # slow provider handshake does not kill the pod (connection refused during boot).
      readinessProbe:
        httpGet:
          path: /readiness
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 36  # ~3 min after initialDelay for provider/model registration
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 120
        periodSeconds: 15
        failureThreshold: 3
      volumeMounts:
        - name: config
          mountPath: /app-root/lightspeed-stack.yaml
          subPath: lightspeed-stack.yaml
        # Agent skills E2E (skills.feature): matches docker-compose mount path
        - name: skills
          mountPath: /app-root/skills
          readOnly: true
        # MCPFileAuth E2E: must match authorization_headers paths in lightspeed-stack-mcp-file-auth.yaml (/tmp/mcp-token)
        - name: mcp-file-auth-token
          mountPath: /tmp/mcp-token
          subPath: token
          readOnly: true
        # InvalidMCPFileAuthConfig E2E: docker-compose mounts tests/e2e/secrets/invalid-mcp-token here
        - name: mcp-invalid-file-auth-token
          mountPath: /tmp/invalid-mcp-token
          subPath: token
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: lightspeed-stack-config
    - name: skills-seed
      configMap:
        name: e2e-skills
    - name: skills
      emptyDir: {}
    - name: mcp-file-auth-token
      secret:
        secretName: mcp-file-auth-token
    - name: mcp-invalid-file-auth-token
      secret:
        secretName: mcp-invalid-file-auth-token
