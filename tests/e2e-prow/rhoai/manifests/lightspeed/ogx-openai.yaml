# OGX from source on UBI: init clones repo + seeds FAISS, main restores seed then uses
# scripts/ogx-entrypoint.sh (same enrich/start path as GitHub Actions docker-compose).
# Needs ConfigMaps: llama-stack-config (run.yaml), rag-data (kv_store.db.gz), lightspeed-stack-config;
# optional OGX-source for repo_url / repo_revision.
#
# RAG fixture lives at KV_RAG_PATH outside ~/.llama, with OGX_CONFIG_DIR set, so
# migrate_legacy_config_dir() cannot move the fixture away on startup.
apiVersion: v1
kind: Pod
metadata:
  name: llama-stack-service
  labels:
    pod: llama-stack-service
spec:
  imagePullSecrets:
    - name: quay-lightspeed-pull-secret
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: setup-from-source
      image: registry.access.redhat.com/ubi9/python-312
      securityContext:
        runAsUser: 0
      env:
        - name: REPO_URL
          valueFrom:
            configMapKeyRef:
              name: llama-stack-source
              key: repo_url
              optional: true
        - name: REPO_REVISION
          valueFrom:
            configMapKeyRef:
              name: llama-stack-source
              key: repo_revision
              optional: true
      command:
        - /bin/bash
        - -c
        - |
          set -e
          # Fast-path: PVC already has a valid venv from a previous pod creation in this pipeline run.
          # TLS scenarios delete+recreate this pod up to 16 times; skipping the expensive install
          # reduces per-restart time from ~6-15 min to ~30-90 s (just RAG seed refresh + chown).
          # Check if cached revision matches requested revision
          CACHED_REVISION=""
          if [[ -f /opt/app-root/.cached-revision ]]; then
            CACHED_REVISION=$(cat /opt/app-root/.cached-revision)
          fi
          REPO_REVISION="${REPO_REVISION:-main}"

          if [[ -d /opt/app-root/.venv ]] \
              && /opt/app-root/.venv/bin/python --version >/dev/null 2>&1 \
              && [[ -d /opt/app-root/src ]] \
              && [[ -f /opt/app-root/scripts/ogx-entrypoint.sh ]] \
              && [[ -f /opt/app-root/src/ogx_configuration.py ]] \
              && [[ "$CACHED_REVISION" == "$REPO_REVISION" ]]; then
            echo "PVC cache hit: app-root already provisioned at $REPO_REVISION — skipping full install"
            mkdir -p /opt/app-root/.e2e-rag-seed /opt/app-root/.e2e-rag-work /opt/app-root/src/.ogx /opt/app-root/src/.llama/storage/files
            if [[ -f /rag-seed/kv_store.db.gz ]]; then
              gzip -dc /rag-seed/kv_store.db.gz > /opt/app-root/.e2e-rag-seed/kv_store.db
              _sz=$(stat -c%s /opt/app-root/.e2e-rag-seed/kv_store.db)
              if [[ "${_sz}" -lt 1048576 ]]; then
                echo "FATAL: RAG seed too small (${_sz} bytes); check rag-data ConfigMap"
                exit 1
              fi
              cp -f /opt/app-root/.e2e-rag-seed/kv_store.db /opt/app-root/.e2e-rag-work/kv_store.db
            fi
            cp -f /opt/app-root/scripts/ogx-entrypoint.sh /opt/app-root/enrich-entrypoint.sh
            cp -f /opt/app-root/src/ogx_configuration.py /opt/app-root/ogx_configuration.py
            chmod 755 /opt/app-root/enrich-entrypoint.sh
            chmod -R 775 /opt/app-root && chown -R 1001:0 /opt/app-root
            echo "PVC fast-path complete"
            exit 0
          fi
          # Full provisioning (PVC is empty — first pod creation this pipeline run).
          REPO_URL="${REPO_URL:-https://github.com/lightspeed-core/lightspeed-stack.git}"
          REPO_REVISION="${REPO_REVISION:-main}"
          case "$REPO_URL" in git@github.com:*) REPO_URL="https://github.com/${REPO_URL#git@github.com:}"; esac
          dnf -y install git tar gcc gcc-c++ make gzip
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="/root/.local/bin:$PATH"
          ln -sf /usr/bin/python3.12 /usr/bin/python3 2>/dev/null || true
          export GIT_TERMINAL_PROMPT=0
          git clone -q "${REPO_URL}" /opt/app-root/repo
          cd /opt/app-root/repo && git fetch origin "${REPO_REVISION}" 2>/dev/null || true && git checkout -q "${REPO_REVISION}"
          uv sync --locked --no-install-project --group ogxlibdev
          (cd /opt/app-root/repo && tar cf - .) | (cd /opt/app-root && tar xf -)
          rm -rf /opt/app-root/repo
          sed -i 's|/opt/app-root/repo/.venv|/opt/app-root/.venv|g' /opt/app-root/.venv/bin/* 2>/dev/null || true
          mkdir -p /opt/app-root/.e2e-rag-seed /opt/app-root/.e2e-rag-work /opt/app-root/src/.ogx /opt/app-root/src/.llama/storage/files
          if [[ ! -f /rag-seed/kv_store.db.gz ]]; then
            echo "FATAL: missing /rag-seed/kv_store.db.gz (ConfigMap rag-data key kv_store.db.gz)"
            ls -la /rag-seed || true
            exit 1
          fi
          gzip -dc /rag-seed/kv_store.db.gz > /opt/app-root/.e2e-rag-seed/kv_store.db
          _sz=$(stat -c%s /opt/app-root/.e2e-rag-seed/kv_store.db)
          if [[ "${_sz}" -lt 1048576 ]]; then
            echo "FATAL: RAG seed too small (${_sz} bytes); check rag-data ConfigMap"
            exit 1
          fi
          cp -f /opt/app-root/.e2e-rag-seed/kv_store.db /opt/app-root/.e2e-rag-work/kv_store.db
          cp -f /opt/app-root/scripts/ogx-entrypoint.sh /opt/app-root/enrich-entrypoint.sh
          cp -f /opt/app-root/src/ogx_configuration.py /opt/app-root/ogx_configuration.py
          # Save the provisioned revision for cache validation
          echo "${REPO_REVISION:-main}" > /opt/app-root/.cached-revision
          chmod 755 /opt/app-root/enrich-entrypoint.sh
          chmod -R 775 /opt/app-root && chown -R 1001:0 /opt/app-root
      volumeMounts:
        - name: app-root
          mountPath: /opt/app-root
        - name: rag-data
          mountPath: /rag-seed
          readOnly: true
    - name: materialize-run-yaml
      image: busybox:latest
      securityContext:
        runAsUser: 0
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cp /cm/run.yaml /work/run.yaml
          chown 1001:0 /work/run.yaml
          chmod 664 /work/run.yaml
      volumeMounts:
        - name: config-cm
          mountPath: /cm
          readOnly: true
        - name: app-root
          mountPath: /work
  containers:
    - name: llama-stack-container
      image: registry.access.redhat.com/ubi9/python-312
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      workingDir: /opt/app-root
      env:
        - name: PATH
          value: "/opt/app-root/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        - name: PYTHONPATH
          value: "/opt/app-root:/opt/app-root/src"
        - name: HOME
          value: "/opt/app-root/src"
        # Match GitHub Actions docker-compose + ogx-entrypoint.sh:
        # registry/SQL under /tmp (writable); FAISS BYOK reads restored fixture outside ~/.llama
        # so OGX migrate_legacy_config_dir() cannot move it away on startup.
        - name: OGX_CONFIG_DIR
          value: "/opt/app-root/src/.ogx"
        - name: KV_STORE_PATH
          value: "/tmp/llama/kv_store.db"
        - name: KV_RAG_PATH
          value: "/opt/app-root/.e2e-rag-work/kv_store.db"
        - name: SQL_STORE_PATH
          value: "/tmp/llama/sql_store.db"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key-secret
              key: key
              optional: true
        - name: E2E_OPENAI_MODEL
          value: "gpt-4o-mini"
        - name: VLLM_URL
          valueFrom:
            secretKeyRef:
              name: vllm-url-secret
              key: key
              optional: true
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-api-key-secret
              key: key
              optional: true
        - name: VLLM_MODEL
          valueFrom:
            secretKeyRef:
              name: vllm-model-secret
              key: key
              optional: true
        - name: FAISS_VECTOR_STORE_ID
          valueFrom:
            secretKeyRef:
              name: faiss-vector-store-secret
              key: id
        - name: E2E_LLAMA_HOSTNAME
          valueFrom:
            secretKeyRef:
              name: llama-stack-ip-secret
              key: key
      command:
        - /bin/bash
        - -c
        - |
          set -e
          RAG_SEED="/opt/app-root/.e2e-rag-seed/kv_store.db"
          RAG_CM_GZ="/opt/app-root/rag-data-cm/kv_store.db.gz"
          RAG_WORK="${KV_RAG_PATH:-/opt/app-root/.e2e-rag-work/kv_store.db}"
          # Skip OGX ~/.llama → ~/.ogx migration (would steal a fixture under ~/.llama).
          export OGX_CONFIG_DIR="${OGX_CONFIG_DIR:-/opt/app-root/src/.ogx}"
          mkdir -p "$OGX_CONFIG_DIR" "$(dirname "$RAG_WORK")"
          restore_rag_seed() {
            mkdir -p "$(dirname "$RAG_WORK")"
            if [[ -f "$RAG_CM_GZ" ]]; then
              RAG_WORK="$RAG_WORK" RAG_CM_GZ="$RAG_CM_GZ" python3 -c 'import gzip, os, shutil, sys; r, g = os.environ["RAG_WORK"], os.environ["RAG_CM_GZ"]; t = r + ".tmp"; i = gzip.open(g, "rb"); o = open(t, "wb"); shutil.copyfileobj(i, o); i.close(); o.close(); sz = os.path.getsize(t); (sz >= 1048576) or (print("FATAL: RAG from ConfigMap too small:", sz, file=sys.stderr) or sys.exit(1)); os.replace(t, r); os.chmod(r, 0o664)' || exit 1
            elif [[ -f "$RAG_SEED" ]]; then
              cp -f "$RAG_SEED" "$RAG_WORK"
              chmod 664 "$RAG_WORK" 2>/dev/null || true
            else
              echo "FATAL: no RAG seed at $RAG_CM_GZ or $RAG_SEED"
              exit 1
            fi
          }
          # Re-inflate golden FAISS fixture (same bytes GH bind-mounts from tests/e2e/rag).
          restore_rag_seed
          if [[ ! -x /opt/app-root/enrich-entrypoint.sh ]]; then
            echo "FATAL: missing /opt/app-root/enrich-entrypoint.sh (init should install it)"
            exit 1
          fi
          # Same enrich + OGX start path as GitHub Actions (docker-compose entrypoint).
          export LLAMA_STACK_CONFIG="${LLAMA_STACK_CONFIG:-/opt/app-root/run.yaml}"
          export LIGHTSPEED_CONFIG="${LIGHTSPEED_CONFIG:-/opt/app-root/lightspeed-stack.yaml}"
          exec /opt/app-root/enrich-entrypoint.sh
      ports:
        - containerPort: 8321
      readinessProbe:
        httpGet:
          path: /v1/health
          port: 8321
        initialDelaySeconds: 20
        periodSeconds: 5
        failureThreshold: 36
      livenessProbe:
        httpGet:
          path: /v1/health
          port: 8321
        initialDelaySeconds: 120
        periodSeconds: 20
        failureThreshold: 3
      volumeMounts:
        - name: app-root
          mountPath: /opt/app-root
        - name: lightspeed-config
          mountPath: /opt/app-root/lightspeed-stack.yaml
          subPath: lightspeed-stack.yaml
          readOnly: true
        - name: rag-data
          mountPath: /opt/app-root/rag-data-cm
          readOnly: true
        # proxy.feature (interception): PEM from Secret e2e-interception-proxy-ca (optional).
        - name: interception-proxy-ca
          mountPath: /tmp/interception-proxy-ca.pem
          subPath: ca.pem
          readOnly: true
        # tls-*.feature: client/CA PEMs from Secret e2e-mock-tls-certs (optional).
        - name: mock-tls-certs
          mountPath: /certs
          readOnly: true
  volumes:
    - name: app-root
      persistentVolumeClaim:
        claimName: llama-stack-app-root
    - name: config-cm
      configMap:
        name: llama-stack-config
    - name: lightspeed-config
      configMap:
        name: lightspeed-stack-config
    - name: rag-data
      configMap:
        name: rag-data
    - name: interception-proxy-ca
      secret:
        secretName: e2e-interception-proxy-ca
        optional: true
    - name: mock-tls-certs
      secret:
        secretName: e2e-mock-tls-certs
        optional: true
