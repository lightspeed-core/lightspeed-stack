# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# =============================================================================
# General
# =============================================================================
language: en-US
tone_instructions: >-
  Prefer concise responses (high information density, low fluff).
  This is an AI-powered assistant that provides answers to product questions using backend LLM services, agents, and RAG databases.
early_access: false
enable_free_tier: true
inheritance: false

# =============================================================================
# Reviews
# =============================================================================
reviews:
  profile: assertive
  request_changes_workflow: false
  
  allow_author_approval: true
  
  high_level_summary: true
  high_level_summary_instructions: ''
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: ''
  review_status: true
  review_info: true
  review_details: true
  review_progress: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  labeling_instructions: []
  mutually_exclusive_groups: {}
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  suggested_reviewers_instructions: []
  in_progress_fortune: true
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters: []
  path_instructions: []
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: true
    include_all_authors: false
  # ---------------------------------------------------------------------------
  # Auto review
  # ---------------------------------------------------------------------------
  auto_review:
    enabled: true
    description_keyword: ''
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
    ignore_usernames: []

  # ---------------------------------------------------------------------------
  # Finishing touches
  # ---------------------------------------------------------------------------
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    custom: []

  # ---------------------------------------------------------------------------
  # Pre-merge checks
  # ---------------------------------------------------------------------------
  pre_merge_checks:
    override_requested_reviewers_only: false
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: warning
      requirements: ''
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: 'Performance and Algorithmic Complexity'
        mode: error
        instructions: |
          BLOCKING. Flag only meaningful performance regressions:
          1. O(n^2)+ algorithms on non-trivial inputs (handlers, K8s list operations).
          2. N+1 patterns: list-then-query-per-item (K8s API, DB).
          3. Expensive work inside loops (API calls, JSON parsing, regex compilation).
          4. Unbounded growth: caches, watchers, buffers without eviction/limits.
          5. Missing pagination/limits on List operations or API endpoints.

          Per issue: file, lines, risk, fix category. If clean, mark PASSED.

      - name: 'Security and Secret Handling'
        mode: error
        instructions: |
          BLOCKING. Flag:
          1. Secrets/tokens logged in plaintext or hardcoded in source.
          2. Missing auth/authz on API endpoints.
          3. Injection vulnerabilities (SQL, command, path traversal).
          4. Sensitive data leaked in API responses, WebSocket messages, or logs.
          5. K8s Secrets and RH secrets missing OwnerReferences.

          Per violation: file, lines, risk. If clean, mark PASSED.

  # ---------------------------------------------------------------------------
  # Tools
  # ---------------------------------------------------------------------------
  post_merge_actions: []
  tools:
    ast-grep:
      enabled: true
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: default
    biome:
      enabled: true
    hadolint:
      enabled: true
    swiftlint:
      enabled: true
    phpstan:
      enabled: true
      level: default
    phpmd:
      enabled: true
    phpcs:
      enabled: true
    golangci-lint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    checkov:
      enabled: true
    tflint:
      enabled: true
    detekt:
      enabled: true
    eslint:
      enabled: true
      e18e:
        enabled: true
    flake8:
      enabled: true
    fbinfer:
      enabled: true
      enable_java: false
    fortitudeLint:
      enabled: true
    rubocop:
      enabled: true
    buf:
      enabled: true
    regal:
      enabled: true
    actionlint:
      enabled: true
    pmd:
      enabled: true
    clang:
      enabled: true
    cppcheck:
      enabled: true
    vale:
      enabled: true
    verilator:
      enabled: true
    opengrep:
      enabled: true
    semgrep:
      enabled: true
    circleci:
      enabled: true
    clippy:
      enabled: true
    sqlfluff:
      enabled: true
    squawk:
      enabled: true
    trivy:
      enabled: true
    prismaLint:
      enabled: true
    pylint:
      enabled: true
    oxc:
      enabled: true
    shopifyThemeCheck:
      enabled: true
    luacheck:
      enabled: true
    brakeman:
      enabled: true
    dotenvLint:
      enabled: true
    htmlhint:
      enabled: true
    stylelint:
      enabled: true
    checkmake:
      enabled: true
    osvScanner:
      enabled: true
    oasdiff:
      enabled: true
    reactDoctor:
      enabled: true
    presidio:
      enabled: true
    blinter:
      enabled: true
    smartyLint:
      enabled: true
    emberTemplateLint:
      enabled: true
    skillspector:
      enabled: true
    psscriptanalyzer:
      enabled: true

# =============================================================================
# Chat
# =============================================================================
chat:
  art: true
  allow_non_org_members: true
  auto_reply: true
  integrations:
    jira:
      usage: auto
      issue_template: ''
    linear:
      usage: auto

# =============================================================================
# Knowledge base
# =============================================================================
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns: []
  learnings:
    scope: auto
    approval_delay: 0
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys: []
    excluded_project_keys: []
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto
  mcp:
    usage: auto
    disabled_servers: []
  automatic_linking_mode: disabled
  automatic_repository_linking: false
  linked_repositories: []

# =============================================================================
# Code generation
# =============================================================================
code_generation:
  docstrings:
    language: en-US
    path_instructions: []
  unit_tests:
    path_instructions: []

# =============================================================================
# Issue enrichment
# =============================================================================
issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels: []
  labeling:
    labeling_instructions: []
    auto_apply_labels: false
