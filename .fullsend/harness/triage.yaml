# UIE triage harness overlay for lightspeed-core/lightspeed-stack
#
# Extends the upstream fullsend-ai/agents triage harness (pinned to the
# v0.51.0 commit with a SHA-256 integrity fragment) and narrows dispatch to
# the UIE routing boundary:
#   - the issue carries exactly one repo: label, and it is this repository's
#   - triage dispatches only when ready-to-triage is added, or a comment's
#     first line is the /fs-triage command
# Automatic triage -> code handoff is disabled for the initial rollout.
base: https://raw.githubusercontent.com/fullsend-ai/agents/16657d540187b16743c8693dc2ccc40366334430/harness/triage.yaml#sha256=7ae860e69a33d89d3efefcf823411fc175177402bb19bebd9a6ec0374a2bef08

trigger: >
  event.source.system == "jira"
    && event.entity.kind == "work_item"
    && "repo:lightspeed-core/lightspeed-stack" in event.state.labels
    && event.state.labels.filter(label, label.startsWith("repo:")).size() == 1
    && (
     (event.transition.kind == "label_changed"
       && event.transition.label.action == "added"
       && event.transition.label.name == "ready-to-triage")
     ||
     (event.transition.kind == "comment_added"
       && has(event.transition.comment.command)
       && event.transition.comment.command == "/fs-triage")
   )

# Disable automatic code-agent handoff during the initial rollout.
env:
  runner:
    TRIAGE_AUTO_CODE: "off"
    TRIAGE_AUTO_CODE_CATEGORIES: ""
  sandbox:
    TRIAGE_AUTO_CODE: "off"
    TRIAGE_AUTO_CODE_CATEGORIES: ""
