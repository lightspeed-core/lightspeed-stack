# Built-in default OGX baseline for unified-mode synthesis.
#
# This file is the starting point when a unified `lightspeed-stack.yaml`
# selects `ogx.config.baseline: default` (the default) and does not
# point at a `profile:`. The synthesizer (src/ogx_configuration.py)
# layers enrichment, high-level `inference.providers`, and `native_override`
# on top of this baseline to produce the final run.yaml handed to OGX.
#
# It is intentionally thinner than the repo-root run.yaml: it carries only the
# APIs and providers needed to boot a minimal, queryable stack (inference,
# vector_io, responses, tool_runtime, files, file_processors) plus the storage
# backends those providers reference. tool_runtime includes file-search
# (file_search / RAG) and model-context-protocol (MCP) so those capabilities
# work when operators enable them. file_processors (inline::pypdf) is required
# for vector-store file attach / Notebook indexing after OGX removed the
# legacy PyPDF fallback. Operators extend it via high-level sections or
# `native_override` (e.g. swap pypdf for inline::docling).
#
# NOTE: `external_providers_dir` carries a default (`:=/tmp/.llama/providers.d`)
# so the baseline resolves even when EXTERNAL_PROVIDERS_DIR is unset — see the
# PoC finding in docs/design/ogx-config-merge/ogx-config-merge-spike.md.
# Uses /tmp to ensure write permissions in containerized environments.
version: 2

apis:
- responses
- conversations
- files
- file_processors
- inference
- tool_runtime
- vector_io

distro_name: starter
external_providers_dir: ${env.EXTERNAL_PROVIDERS_DIR:=/tmp/.llama/providers.d}

providers:
  inference:
  - provider_id: ${env.OPENAI_API_KEY:+openai}
    provider_type: remote::openai
    config:
      api_key: ${env.OPENAI_API_KEY:=}
      allowed_models: ["${env.E2E_OPENAI_MODEL:=gpt-4o-mini}"]
  - provider_id: sentence-transformers
    provider_type: inline::sentence-transformers
  files:
  - config:
      metadata_store:
        table_name: files_metadata
        backend: sql_default
      storage_dir: ${env.SQLITE_STORE_DIR:=/tmp/.llama/storage/files}
    provider_id: meta-reference-files
    provider_type: inline::localfs
  # required for /v1/vector-stores to work with files properly
  file_processors:
  - provider_id: pypdf
    provider_type: inline::pypdf
    config:
      default_chunk_size_tokens: 800
      default_chunk_overlap_tokens: 400
  tool_runtime:
  - config: {}
    provider_id: model-context-protocol
    provider_type: remote::model-context-protocol
  - config: {}
    provider_id: file-search
    provider_type: inline::file-search
  vector_io:
  - config:
      persistence:
        namespace: vector_io::faiss
        backend: kv_default
    provider_id: faiss
    provider_type: inline::faiss
  responses:
  - config:
      persistence:
        responses:
          table_name: agents_responses
          backend: sql_default
    provider_id: meta-reference
    provider_type: inline::builtin

storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: ${env.KV_STORE_PATH:=/tmp/.llama/storage/rag/kv_store.db}
    sql_default:
      type: sql_sqlite
      db_path: ${env.SQL_STORE_PATH:=/tmp/.llama/storage/sql_store.db}
  stores:
    metadata:
      namespace: registry
      backend: kv_default
    inference:
      table_name: inference_store
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
    conversations:
      table_name: openai_conversations
      backend: sql_default
    prompts:
      table_name: prompts
      backend: sql_default
    connectors:
      table_name: connectors
      backend: sql_default

registered_resources:
  models: []
  vector_stores: []

# REQUIRED for file_search tool calls to work. Without it, OGX's
# file-search runtime silently fails all file_search operations with no error logged.
vector_stores:
  # LCORE-1498: Disables OGX RAG annotation generation that causes
  # unwanted citation/file markers in model output.
  annotation_prompt_params:
    enable_annotations: false
  default_provider_id: faiss
  default_embedding_model:
    provider_id: sentence-transformers
    model_id: nomic-ai/nomic-embed-text-v1.5
